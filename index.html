<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schedule</title>

    <!-- Ставим data-mantine-color-scheme на <html> до первой отрисовки, чтобы
         не мигало неверным фоном. Это тот же код, что у Mantine
         <ColorSchemeScript defaultColorScheme="auto" />: читается ключ
         mantine-color-scheme-value (соответствует localStorageColorSchemeManager).
         Атрибута достаточно — фон body сам заполнит весь холст. -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('mantine-color-scheme-value');
          var colorScheme = saved === 'light' || saved === 'dark' || saved === 'auto' ? saved : 'auto';
          var computedColorScheme =
            colorScheme !== 'auto'
              ? colorScheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', computedColorScheme);
        } catch (e) {
          /* storage недоступен — полагаемся на дефолт Mantine */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
